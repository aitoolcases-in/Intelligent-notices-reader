<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:SS4;src:url(node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:SS4;src:url(node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:SS4;src:url(node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-400-italic.woff2);font-weight:400;font-style:italic}
@font-face{font-family:SS4;src:url(node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-600-italic.woff2);font-weight:600;font-style:italic}
@font-face{font-family:SS4X;src:url(node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-ext-400-normal.woff2);font-weight:400}
@font-face{font-family:SS4X;src:url(node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-ext-600-normal.woff2);font-weight:600}
@font-face{font-family:SS4X;src:url(node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-ext-600-italic.woff2);font-weight:600;font-style:italic}
@font-face{font-family:MS;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:MS;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:MSX;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-ext-700-normal.woff2);font-weight:700}
@font-face{font-family:MSX;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-ext-800-normal.woff2);font-weight:800}
@font-face{font-family:CV;src:url(node_modules/@fontsource/caveat/files/caveat-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:CVX;src:url(node_modules/@fontsource/caveat/files/caveat-latin-ext-600-normal.woff2);font-weight:600}
html,body{margin:0;padding:0;background:#f7f5ef}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#f7f5ef;font-family:SS4,SS4X,Georgia,serif;color:#034620}
.layer{background:#f7f5ef}
.layer.green{background:#034620;color:#f7f5ef}
.ring{position:absolute;border:4px solid #9fbfab;border-radius:9999px;pointer-events:none}
.green .ring{border-color:#2d7049}
.logo{position:absolute;left:72px;top:74px;height:118px}
.kick{position:absolute;left:80px;top:232px;font-family:MS,MSX,sans-serif;font-weight:700;font-size:26px;letter-spacing:.14em;color:#3f5e4b}
.mark{background:#e2b04a;color:#034620;border-radius:8px;padding:0 12px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.mark.loss{background:#a8452a;color:#f7f5ef}
.layer{position:absolute;inset:0}
.ab{position:absolute}
.hl{position:absolute;left:80px;top:280px;width:900px;font-family:MS,MSX,sans-serif;font-size:72px;line-height:1.12;font-weight:800;letter-spacing:-.01em;color:#034620}
.green .hl{color:#f7f5ef}
.lab{font-family:MS,MSX,sans-serif;font-weight:700;letter-spacing:.06em}
.hand{font-family:MS,MSX,sans-serif;font-weight:700;letter-spacing:-.01em}
.foot{font-family:MS,MSX,sans-serif;font-weight:700;font-size:22px;line-height:1.4;color:#3f5e4b}
</style></head>
<body>
<div id="stage"></div>
<svg width="0" height="0" style="position:absolute">
<defs>
<filter id="pencil" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
<pattern id="hG" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#f7f5ef"/><line x1="0" y1="0" x2="0" y2="14" stroke="#9fbfab" stroke-width="2.6"/></pattern>
<pattern id="hD" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="9" height="9" fill="#2d7049"/><line x1="0" y1="0" x2="0" y2="9" stroke="#034620" stroke-width="3"/></pattern>
<pattern id="hA" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#f1cf86"/><line x1="0" y1="0" x2="0" y2="14" stroke="#c98f1c" stroke-width="3"/></pattern>
<pattern id="hR" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#f3d7cc"/><line x1="0" y1="0" x2="0" y2="14" stroke="#a8452a" stroke-width="3.4"/></pattern>
<pattern id="hN" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#dfe9e2"/><line x1="0" y1="0" x2="0" y2="14" stroke="#2d7049" stroke-width="3.4"/></pattern>
</defs>
</svg>
<script src="vo_skills2.js"></script>
<script>
const INK='#034620', GREEN='#034620', LOSS='#a8452a', G6='#2d7049', AMB='#e2b04a';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const P=(u,a,d=.5)=>ease((u-a)/d);
// appear: fade + rise
const ap=(u,a,d=.45)=>{const p=P(u,a,d);return `opacity:${p};transform:translateY(${(1-p)*24}px);`};
let GT=0;
const draw=(p)=>`pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-clamp(p)}"`;
const EVENTS=[]; // build-step times for audio
function hl(u,a,em,b,cls=''){return `<div class="hl" style="${ap(u,0.15,.5)}">${a}<span class="mark ${cls}">${em}</span>${b||''}</div>`}
const kick=(u,txt)=>`<div class="kick" style="${ap(u,0,.4)}">${txt}</div>`;
const ring=(x,y,d)=>`<div class="ring" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px"></div>`;

// ---------- the hero: Rohan ----------
function rohan(x,y,s,o={}){
  const mood=o.mood||'happy', prop=o.prop||'none', ph=x*0.0131+y*0.007;
  const look=(o.look||0)+Math.sin(GT*0.8+ph*3)*4;
  const bob=Math.sin(GT*2.4+ph)*4, tilt=Math.sin(GT*1.3+ph)*3 + (mood==='worried'?-4:0);
  const jump=o.jump?-Math.abs(Math.sin(GT*5.5))*40:0;
  const blink=((GT+ph*5)%3.3)<0.14;
  const mouth = mood==='cheer' ? 'M172,312 Q200,356 230,312 Z' : mood==='happy' ? 'M178,318 Q200,338 224,316' : mood==='worried' ? 'M180,326 Q200,314 222,326' : 'M182,322 L220,320';
  const eyes = blink ? `<path d="M158,270 H178 M224,270 H244" stroke-width="5"/>` : `<circle cx="168" cy="270" r="5" fill="${INK}"/><circle cx="234" cy="270" r="5" fill="${INK}"/>`;
  const sw=Math.sin(GT*7+ph)*10;
  let arm='';
  if(o.scratch) arm=`<path d="M300,470 C340,420 330,330 ${300+sw*0.4},${262+sw*0.3}" stroke-width="5" fill="none"/><circle cx="${300+sw*0.4}" cy="${258+sw*0.3}" r="18" fill="#f7f5ef"/>`;
  if(mood==='cheer') arm=`<path d="M300,470 C340,400 360,320 ${370+sw},${220}" stroke-width="5" fill="none"/><circle cx="${370+sw}" cy="210" r="20" fill="#f7f5ef"/><path d="M100,470 C60,400 40,320 ${30-sw},${220}" stroke-width="5" fill="none"/><circle cx="${30-sw}" cy="210" r="20" fill="#f7f5ef"/>`;
  const brows = mood==='worried' ? '<path d="M146,236 L190,244 M212,244 L256,234" />' : '<path d="M146,238 Q168,228 190,236 M212,236 Q234,228 256,238" />';
  let propS='';
  if(prop==='phone') propS=`<g transform="translate(250,440) rotate(${-12+Math.sin(GT*1.7+ph)*5} 30 120)"><rect x="0" y="0" width="70" height="128" rx="12" fill="url(#hA)" stroke="${INK}" stroke-width="4"/><rect x="9" y="14" width="52" height="92" rx="4" fill="#fbe7b9" stroke="${INK}" stroke-width="2.5"/></g><path d="M300,600 C300,540 280,500 262,486 C250,478 246,500 258,508" fill="#f7f5ef" stroke="${INK}" stroke-width="4"/>`;
  if(prop==='bill') propS=`<g transform="translate(230,430) rotate(8)"><path d="M0,0 L120,0 L120,150 L110,140 L100,150 L90,140 L80,150 L70,140 L60,150 L50,140 L40,150 L30,140 L20,150 L10,140 L0,150 Z" fill="#fff" stroke="${INK}" stroke-width="4"/><path d="M16,30 H100 M16,56 H90 M16,82 H70" stroke="#8a8a84" stroke-width="5"/><path d="M16,112 H100" stroke="${LOSS}" stroke-width="7"/></g>`;
  if(prop==='calendar') propS=`<g transform="translate(240,420) rotate(6)"><rect x="0" y="0" width="140" height="130" fill="#fff" stroke="${INK}" stroke-width="4"/><rect x="0" y="0" width="140" height="34" fill="url(#hN)" stroke="${INK}" stroke-width="4"/><path d="M20,62 l12,12 l22,-24 M64,62 l12,12 l22,-24 M20,100 l12,12 l22,-24 M64,100 l12,12 l22,-24" stroke="${GREEN}" stroke-width="5" fill="none"/></g>`;
  if(prop==='laptop') propS=`<g transform="translate(60,450) rotate(${Math.sin(GT*1.2+ph)*1.5} 140 100)"><rect x="0" y="0" width="280" height="180" rx="12" fill="#fff" stroke="${INK}" stroke-width="5"/><rect x="70" y="62" width="140" height="52" rx="26" fill="#f3d7cc" stroke="${INK}" stroke-width="3"/><text x="140" y="98" text-anchor="middle" font-family="MS,MSX,sans-serif" font-weight="800" font-size="28" fill="${INK}" stroke="none">Claude</text><path d="M-30,180 L310,180 L330,212 L-50,212 Z" fill="url(#hG)" stroke="${INK}" stroke-width="5"/></g>`;
  const sweat = o.sweat ? `<path d="M296,200 C292,214 288,222 296,228 C304,222 300,214 296,200Z" fill="#cfe3ee" stroke="${INK}" stroke-width="3"/>` : '';
  return `<g transform="translate(${x},${y+jump}) scale(${s})" filter="url(#pencil)" stroke="${INK}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
   <path d="M40,640 C46,500 100,420 200,408 C300,420 354,500 360,640 Z" fill="url(#hG)"/>
   <path d="M200,408 C186,440 176,470 170,520 M200,408 C214,440 224,470 230,520" />
   <path d="M150,412 L200,470 L250,412" fill="#f7f5ef"/>
   <path d="M120,440 C118,500 112,560 110,640 M282,440 C286,500 292,560 292,640" stroke-width="3.5"/>
   <path d="M178,348 L178,412 M222,348 L222,412" />
   <g transform="translate(0,${bob}) rotate(${tilt} 200 380)">
   ${o.hair==='long'?`<path d="M108,250 C98,160 160,122 204,124 C252,122 312,160 298,252 C300,320 312,380 318,430 C300,446 284,440 270,452 C262,420 262,380 262,340 L146,340 C144,380 142,420 132,452 C118,440 102,446 86,430 C94,380 106,320 108,250 Z" fill="url(#hD)"/>`:`<ellipse cx="114" cy="272" rx="16" ry="26" fill="#f7f5ef"/><ellipse cx="288" cy="272" rx="16" ry="26" fill="#f7f5ef"/>`}
   <path d="M118,250 C116,330 150,372 200,374 C252,372 286,330 284,250 C284,200 250,170 200,170 C150,170 118,200 118,250Z" fill="#f7f5ef"/>
   ${o.hair==='long'?`<path d="M204,162 C168,164 124,196 116,262 C136,226 168,206 204,196 Z" fill="url(#hD)"/><path d="M204,162 C240,164 282,196 288,262 C268,226 238,206 204,196 Z" fill="url(#hD)"/><circle cx="112" cy="318" r="7" fill="url(#hA)"/><circle cx="290" cy="318" r="7" fill="url(#hA)"/>`:`<path d="M112,262 C96,170 160,120 214,130 C268,124 312,170 292,256 C290,222 272,200 250,196 C236,214 196,212 176,200 C160,214 136,212 124,206 C118,224 116,244 112,262Z" fill="url(#hD)"/>`}
   ${o.glasses===false?`<g transform="translate(${look},0)">${eyes}<path d="M154,256 L160,261 M248,256 L242,261" stroke-width="3.5"/></g>`:`<g transform="translate(${look},0)"><rect x="140" y="248" width="54" height="42" rx="12" fill="#fbfbf8"/><rect x="208" y="248" width="54" height="42" rx="12" fill="#fbfbf8"/><path d="M194,266 Q201,258 208,266 M140,264 L120,258 M262,264 L284,258"/>
   ${eyes}</g>`}
   ${brows}
   <path d="M200,284 C196,298 192,304 202,306" />
   <path d="${mouth}" ${mood==='cheer'?'fill="#fff"':''}/>
   ${sweat}
   </g>
   ${arm}
   ${propS}
  </g>`;
}
function sv(inner,x=0,y=0,w=1080,h=1920){return `<svg class="ab" style="left:${x}px;top:${y}px" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`}
const T=(x,y,html,style='')=>`<div class="ab" style="left:${x}px;top:${y}px;${style}">${html}</div>`;
function tick(u,a,x,y,text,col=INK){
  const p=P(u,a,.4);
  return sv(`<g filter="url(#pencil)"><rect x="4" y="4" width="54" height="54" fill="none" stroke="${INK}" stroke-width="4"/><path d="M14,30 L28,46 L56,10" fill="none" stroke="${GREEN}" stroke-width="7" stroke-linecap="round" ${draw(P(u,a+.1,.35))}/></g>`,x,y,64,64)
   + T(x+90,y+2,`<span style="font-size:46px;color:${col}">${text}</span>`,`opacity:${p}`);
}

// ---------- scenes ----------
const SC=[];
// ---------- extra drawings ----------
const PR={hair:'long',glasses:false};
const pr=(o)=>Object.assign({},PR,o);
function bubble(x,y,w,text,u,a,side='l'){ // a chat message (no app logos)
  const p=P(u,a,.35);
  return `<div class="ab" style="left:${x}px;top:${y}px;width:${w}px;opacity:${p};transform:translateY(${(1-p)*20}px) scale(${.9+.1*p});transform-origin:${side==='l'?'0':'100%'} 100%;">
   <div style="background:#dfe9e2;border:3px solid #034620;border-radius:22px ${side==='l'?'22px 22px 4px':'22px 4px 22px'};padding:14px 20px;font-size:34px;line-height:1.2;color:#034620">${text}</div></div>`;
}
function book(x,y,s,u,a){ // the counter book, open, with scribbled orders
  const p=P(u,a,.45);
  return sv(`<g filter="url(#pencil)" transform="translate(${x},${y}) scale(${s})" style="opacity:${p}">
   <path d="M0,20 Q110,0 220,20 V320 Q110,300 0,320 Z" fill="#fff" stroke="${INK}" stroke-width="5"/>
   <path d="M220,20 Q330,0 440,20 V320 Q330,300 220,320 Z" fill="#fff" stroke="${INK}" stroke-width="5"/>
   <path d="M220,20 V320" stroke="${INK}" stroke-width="5"/>
   <path d="M24,70 q20,-14 40,0 t40,0 t40,0 M24,120 q20,-14 40,0 t40,0 M24,170 q20,-14 40,0 t40,0 t40,0 t30,0 M24,220 q20,-14 40,0 M244,70 q20,-14 40,0 t40,0 t40,0 M244,120 q20,-14 40,0 t40,0 t40,0 M244,170 q20,-14 40,0 t40,0" fill="none" stroke="#5b6b60" stroke-width="4"/>
  </g>`);
}
function card(x,y,w,h,title,lines,u,a,num){
  const p=P(u,a,.45);
  return sv(`<g filter="url(#pencil)" style="opacity:${p}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="20" fill="#fff" stroke="${INK}" stroke-width="5"/>${num?`<circle cx="${x}" cy="${y}" r="34" fill="#034620"/>`:''}</g>`)+
   (num?T(x-12,y-26,`<span class="lab" style="font-size:36px;color:#f7f5ef">${num}</span>`,`opacity:${p}`):'')+
   T(x+40,y+26,`<div style="width:${w-72}px"><div class="lab" style="font-size:30px;color:#034620">${title}</div>${lines?`<div style="font-size:34px;color:#3f5e4b;margin-top:8px;line-height:1.25">${lines}</div>`:''}</div>`,`opacity:${p}`);
}

// 1 hook
SC.push({kick:'ACCREVISE EXPLAINS',ring:[520,700,1100],d:3.5,ev:[.2,1,1.8],f:u=>
  `<div class="hl" style="${ap(u,.2)}">Claude Skills,</div>` +
  `<div class="hl" style="top:372px;${ap(u,1)}"><span class="mark">explained.</span></div>` +
  T(80,500,`<span class="lab" style="font-size:30px;color:#3f5e4b">FOR A SMALL SHOP</span>`,ap(u,1.8)) +
  sv(rohan(20,440,1.5,pr({prop:'phone',mood:'happy'})),0,0) +
  bubble(640,600,360,'2kg KK – Sharma ji',u,1.2,'r') + bubble(640,730,360,'1 box soan papdi, Sat',u,1.9,'r')
});
// 2 meet the hero: WhatsApp + counter book
SC.push({kick:'MEET PRIYA',ring:[-500,1100,1000],d:5,ev:[.2,.8,1.5,2.2,2.9],f:u=>
  hl(u,'Priya runs a ','sweet shop') +
  `<div style="opacity:${P(u,.3,.5)}">`+sv(rohan(-20,470,1.0,pr({prop:'phone',mood:'neutral'})),0,0)+`</div>` +
  T(560,470,`<span class="lab" style="font-size:28px;color:#3f5e4b">ON WHATSAPP</span>`,ap(u,.6)) +
  bubble(560,520,420,'2kg KK – Sharma ji',u,.8) +
  bubble(560,630,420,'same as last week pls',u,1.5) +
  bubble(560,740,420,'1 box soan papdi, Sat',u,2.2) +
  T(560,880,`<span class="lab" style="font-size:28px;color:#3f5e4b">IN THE COUNTER BOOK</span>`,ap(u,2.9)) +
  book(560,930,.95,u,2.9)
});
// 3 the real job
SC.push({kick:'THE REAL JOB',ring:[600,1250,900],d:4.5,ev:[.2,.6,1.6,2.6],f:u=>
  hl(u,'She ','retypes',' every order') +
  bubble(80,480,360,'2kg KK – Sharma ji',u,.6) + book(80,610,.75,u,.8) +
  sv(`<g filter="url(#pencil)"><path d="M440,700 C500,690 540,690 600,700" fill="none" stroke="${LOSS}" stroke-width="7" ${draw(P(u,1.6,.5))}/><path d="M580,680 L604,700 L580,720" fill="none" stroke="${LOSS}" stroke-width="7" style="opacity:${P(u,2,.2)}"/></g>`) +
  sv(`<g filter="url(#pencil)" style="opacity:${P(u,1.6,.4)}"><rect x="640" y="560" width="340" height="230" rx="12" fill="#fff" stroke="${INK}" stroke-width="5"/><path d="M670,610 H950 M670,650 H900 M670,690 H930 M670,730 H860" stroke="#9fbfab" stroke-width="7"/><path d="M610,790 L1010,790 L1030,830 L590,830 Z" fill="url(#hG)" stroke="${INK}" stroke-width="5"/></g>`) +
  T(660,850,`<span class="lab" style="font-size:28px;color:#034620">HER BILLING APP</span>`,ap(u,1.8)) +
  `<div style="opacity:${P(u,2.4,.5)}">`+sv(rohan(340,960,.85,pr({prop:'bill',mood:'worried',scratch:u>3})),0,0)+`</div>`
});
// 4 her evenings
SC.push({kick:'HER EVENINGS',ring:[500,-350,800],d:4.8,ev:[.2,.8,1.8,2.8],f:u=>{
  const box=(a,x,lab,val,col)=>{const p=P(u,a,.45);return sv(`<g filter="url(#pencil)" style="opacity:${p}"><rect x="6" y="6" width="268" height="190" fill="#fff" stroke="${INK}" stroke-width="5"/></g>`,x,520,280,200)+T(x,540,`<div style="width:280px;text-align:center"><div class="lab" style="font-size:24px;color:#3f5e4b">${lab}</div><div style="font-size:60px;margin-top:28px;color:${col||'#034620'}">${val}</div></div>`,`opacity:${p}`)};
  return hl(u,'Every ','evening') + box(.8,70,'ORDERS A DAY','40') + box(1.8,400,'EACH','3 min') + box(2.8,730,'EVERY EVENING','2 hrs',LOSS) +
   `<div style="opacity:${P(u,3,.5)}">`+sv(rohan(340,860,.95,pr({prop:'bill',mood:'worried',sweat:u>3.6})),0,0)+`</div>`;
}});
// 5 the real cost
SC.push({kick:'THE REAL COST',ring:[-400,1300,900],d:6,ev:[.2,.6,2.6,3.8],f:u=>{
  const hrs=Math.round(clamp((u-.6)/2)*600);
  return hl(u,'One year ','later') +
   T(80,470,`<div style="font-size:200px;line-height:1;color:${LOSS};font-weight:600">${hrs}</div><div class="lab" style="font-size:36px;color:#034620;margin-top:10px">HOURS OF RETYPING</div>`,`opacity:${P(u,.6,.3)}`) +
   T(80,760,`<span style="font-size:40px;color:#3f5e4b">2 hrs × 300 working days</span>`,ap(u,2.6)) +
   sv(`<g filter="url(#pencil)" style="opacity:${P(u,3.8,.4)}"><rect x="80" y="860" width="520" height="130" rx="14" fill="url(#hR)" stroke="${INK}" stroke-width="5"/></g>`) +
   T(110,885,`<div style="font-size:38px;color:#034620;background:#fff;padding:4px 12px;display:inline-block">2 kg typed as <b style="color:${LOSS}">2 boxes</b></div>`,ap(u,3.8)) +
   `<div style="opacity:${P(u,2.6,.5)}">`+sv(rohan(600,820,.85,pr({mood:'worried',scratch:true,sweat:u>3.8})),0,0)+`</div>`;
}});
// 6 the twin
SC.push({kick:'WHAT IF',ring:[640,-300,800],d:5.5,ev:[.2,.8,2.2],f:u=>{
  const sp=P(u,.8,.6);
  return hl(u,'A ','second',' Priya') +
   sv(`<g filter="url(#pencil)"><path d="M540,470 L540,${470+1000*sp}" stroke="${INK}" stroke-width="5"/></g>`) +
   `<div style="opacity:${sp}">`+sv(rohan(40,620,1.15,pr({prop:'bill',mood:'neutral'})),0,0)+sv(rohan(590,620,1.15,pr({prop:'laptop',mood:'happy'})),0,0)+`</div>`+
   T(80,1380,`<span class="lab" style="font-size:30px;color:#3f5e4b">RETYPES EVERY ORDER</span>`,ap(u,1.2)) +
